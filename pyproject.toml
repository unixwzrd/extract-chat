[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "extract-chat"
version = "0.5.9"
description = "Convert OpenAI and ChatGPT conversation JSON exports into readable Markdown or HTML logs with citations."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "unixwzrd" }]
dependencies = [
  "pydantic>=2",
  "ftfy>=6.2",
  "markdown>=3.6",
  "unicodefix @ git+https://github.com/unixwzrd/UnicodeFix.git",
]

[project.optional-dependencies]
mac-app = ["pyinstaller>=6.0"]
token-counting = ["tiktoken>=0.7"]

[project.scripts]
extract-chat = "extract_chat.cli:main"

[project.urls]
Homepage = "https://github.com/unixwzrd/extract-chat"
Issues = "https://github.com/unixwzrd/extract-chat/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["extract_chat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
