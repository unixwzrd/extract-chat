[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "extract-chat"
version = "1.0.0"
description = "Convert ChatGPT conversation JSON and LogGPT+ ZIP archives into readable Markdown or HTML logs with local artifacts."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{ name = "unixwzrd" }]
dependencies = [
  "pydantic>=2",
  "ftfy>=6.2",
  "markdown>=3.6",
  "markdown-it-py>=3.0",
  "unicodefix @ git+https://github.com/unixwzrd/UnicodeFix.git@9e1cca9f9bb20139c258fe17c68ae7ee33391337",
]

[project.optional-dependencies]
mac-app = ["pyinstaller>=6.0"]
token-counting = ["tiktoken>=0.7"]

[project.scripts]
extract-chat = "extract_chat.cli:main"

[project.urls]
Homepage = "https://github.com/unixwzrd/extract-chat"
Issues = "https://github.com/unixwzrd/extract-chat/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["extract_chat*"]
exclude = ["extract_chat.utils", "extract_chat.utils.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
